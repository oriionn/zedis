<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zedis</title>
<!-- Relative, like every address on this page: see `root` below. -->
<link rel="icon" type="image/png" href="./assets/icon.png" />
<style>
  :root { color-scheme: light dark; --line: #8883; --bad: #cf222e; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e1e; }
  body { font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; color: #ddd; }
  canvas { display: block; }
  main { max-width: 22rem; margin: 18vh auto 0; padding: 1.5rem; border: 1px solid var(--line); border-radius: .5rem; }
  h1 { font-size: 1.1rem; margin: 0 0 1rem; }
  label { display: block; }
  label + label { margin-top: .75rem; }
  label span { display: block; margin-bottom: .25rem; font-size: .85rem; opacity: .8; }
  label.check { display: flex; align-items: center; gap: .5rem; }
  label.check input { width: auto; }
  label.check span { margin: 0; }
  input, textarea { width: 100%; box-sizing: border-box; padding: .5rem; border: 1px solid var(--line);
          border-radius: .375rem; background: transparent; color: inherit; font: inherit; }
  textarea { resize: vertical; }
  button { margin-top: .75rem; padding: .5rem 1rem; border: 0; border-radius: .375rem; background: #1f6feb; color: #fff;
           font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { margin-top: .75rem; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: .85rem; }
  .bad { color: var(--bad); }
  .good { color: #3fb950; font-family: inherit; }
  .note { margin: 0 0 1rem; font-size: .85rem; opacity: .8; }
  .link { margin-top: 1rem; padding: 0; background: none; color: #58a6ff; font-size: .85rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="login" hidden>
  <h1>Zedis</h1>
  <!-- A real form with named, autocomplete-tagged fields: that is what lets
       the browser's own password manager offer to save the credential and
       fill it in next time. The password is never kept by this page. -->
  <form id="login-form" autocomplete="on">
    <label>
      <span data-i18n="username">Username</span>
      <input id="username" name="username" type="text" autocomplete="username" required />
    </label>
    <label>
      <span data-i18n="password">Password</span>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
    </label>
    <label class="check">
      <input id="remember" name="remember" type="checkbox" checked />
      <span data-i18n="remember_device">Keep me signed in on this device (30 days)</span>
    </label>
    <button id="go" type="submit" data-i18n="sign_in">Sign in</button>
  </form>
  <div class="msg bad" id="login-msg"></div>
  <button id="to-setup" class="link" type="button" data-i18n="setup_title" hidden>Create the administrator</button>
  <!-- Only where the bridge takes requests (`--signup approval`). -->
  <button id="to-signup" class="link" type="button" data-i18n="signup_link" hidden>Request an account</button>
</main>
<!-- The first account, or one more after every administrator was lost: the
     setup token from the bridge's log seats it (ADR 17). -->
<main id="setup" hidden>
  <h1 data-i18n="setup_title">Create the administrator</h1>
  <p class="note" data-i18n="setup_intro"></p>
  <form id="setup-form" autocomplete="on">
    <label>
      <span data-i18n="setup_token">Setup token</span>
      <input id="setup-token" type="password" autocomplete="off" required />
    </label>
    <label>
      <span data-i18n="account_name">Account name</span>
      <input id="setup-name" name="username" type="text" autocomplete="username" required />
    </label>
    <label>
      <span data-i18n="password">Password</span>
      <input id="setup-password" name="password" type="password" autocomplete="new-password" required />
    </label>
    <label>
      <span data-i18n="repeat_password">Repeat the password</span>
      <input id="setup-confirm" type="password" autocomplete="new-password" required />
    </label>
    <button id="setup-go" type="submit" data-i18n="setup_title">Create the administrator</button>
  </form>
  <p class="note" data-i18n="setup_existing_hint"></p>
  <div class="msg bad" id="setup-msg"></div>
  <button id="to-login" class="link" type="button" data-i18n="sign_in_instead">Sign in instead</button>
</main>
<!-- A request for an account, for an administrator to approve (ADR 17,
     amended 2026-10-18). The answer is the same whatever the name: whether
     one is taken is the administrator's to see. -->
<main id="signup" hidden>
  <h1 data-i18n="signup_title">Request an account</h1>
  <p class="note" data-i18n="signup_intro"></p>
  <form id="signup-form" autocomplete="on">
    <label>
      <span data-i18n="account_name">Account name</span>
      <input id="signup-name" name="username" type="text" autocomplete="username" maxlength="64" required />
    </label>
    <label>
      <span data-i18n="password">Password</span>
      <input id="signup-password" name="password" type="password" autocomplete="new-password" required />
    </label>
    <label>
      <span data-i18n="repeat_password">Repeat the password</span>
      <input id="signup-confirm" type="password" autocomplete="new-password" required />
    </label>
    <label>
      <span data-i18n="signup_note">Note for the administrator (optional)</span>
      <textarea id="signup-note" rows="3" maxlength="500"></textarea>
    </label>
    <button id="signup-go" type="submit" data-i18n="signup_go">Send the request</button>
  </form>
  <div class="msg bad" id="signup-msg"></div>
  <button id="signup-to-login" class="link" type="button" data-i18n="sign_in_instead">Sign in instead</button>
</main>
<!-- An invitation link (`#invite=…`): a new account, or a new password. -->
<main id="register" hidden>
  <h1 id="register-title"></h1>
  <p class="note" id="register-intro"></p>
  <form id="register-form" autocomplete="on">
    <label id="register-name-row">
      <span data-i18n="account_name">Account name</span>
      <input id="register-name" name="username" type="text" autocomplete="username" />
    </label>
    <label id="register-password-row">
      <span data-i18n="password">Password</span>
      <input id="register-password" name="password" type="password" autocomplete="new-password" />
    </label>
    <label id="register-confirm-row">
      <span data-i18n="repeat_password">Repeat the password</span>
      <input id="register-confirm" type="password" autocomplete="new-password" />
    </label>
    <label class="check">
      <input id="register-remember" type="checkbox" checked />
      <span data-i18n="remember_device">Keep me signed in on this device (30 days)</span>
    </label>
    <button id="register-go" type="submit"></button>
  </form>
  <div class="msg bad" id="register-msg"></div>
</main>
<main id="loading" hidden><h1>Zedis</h1><div class="msg" id="loading-msg" data-i18n="loading">Loading…</div></main>

<script type="module">
  // Same origin on purpose: the bridge serves this page, so the API is right
  // here and the login cookie can stay SameSite=Strict. The wasm holds no
  // password — it signs in here for a cookie and every fetch carries it.
  const $ = (id) => document.getElementById(id);
  // Where this page was served from, without the trailing slash: the origin,
  // or the origin plus the bridge's `--base-path` when it shares a host name
  // with other applications (`https://tools.example.com/zedis`). Everything
  // below is addressed from here and never from `/` — the site root belongs
  // to the neighbours. The bridge is not asked for its prefix: the address
  // bar already knows it, and it stays right behind a proxy that rewrites it.
  const root = new URL(".", window.location.href).href.replace(/\/$/, "");
  const api = (path, init) => fetch(root + path, { credentials: "same-origin", ...init });
  // Filled by the bridge as it serves this page: the content hash of each
  // file the page fetches, from the bundle it is serving
  // (`static_files::with_asset_map`). Written empty, and only ever written
  // empty — a page opened any other way fetches unversioned URLs.
  const ASSET_REV = /*ASSET_REV*/{}/*/ASSET_REV*/;
  const url = (path) => {
    const v = ASSET_REV[path];
    return v ? `${root}/${path}?v=${v}` : `${root}/${path}`;
  };
  // An input method's keystrokes are not the application's. gpui-pre-web
  // (through 0.3.5) decides that from `isComposing` alone, but the *first*
  // key of a composition arrives before `compositionstart`: `isComposing` is
  // still false and, in Chrome on macOS, `key` is the letter itself — so the
  // letter is inserted as text and "你" comes out as "n你". `keyCode` 229 is
  // what marks a key the IME took, on every browser, so those keydowns are
  // stopped here, in the capture phase on `window`, before they reach the
  // backend's listener. Not `preventDefault`: the IME still has to see them.
  // The same check keeps Enter, Backspace and the arrows from also firing the
  // application's bindings while they are choosing a candidate. Delete when
  // upstream checks for 229 itself.
  window.addEventListener(
    "keydown",
    (event) => {
      if (event.isComposing || event.keyCode === 229) event.stopImmediatePropagation();
    },
    true,
  );

  const SUPPORTED_LOCALES = ["en", "zh", "de", "es", "fr", "ja", "pt", "ru"];
  // The UI language the first frame will `t!`. Saved preference lives in
  // the same `localStorage` key the wasm writes (`zedis:zedis.toml`); a
  // first visit follows `navigator.language`. Always also load `en`, the
  // rust-i18n fallback, so a missing key does not render as the key name.
  function preferredLocale() {
    try {
      const toml = localStorage.getItem("zedis:zedis.toml") || "";
      const m = toml.match(/^\s*locale\s*=\s*"([a-z]+)"/m);
      if (m && SUPPORTED_LOCALES.includes(m[1])) return m[1];
    } catch {
      // private mode / denied storage: fall through to the browser language
    }
    const lang = (navigator.language || "en").split("-")[0].toLowerCase();
    return SUPPORTED_LOCALES.includes(lang) ? lang : "en";
  }

  // The `key = "value"` lines of one `[section]` of a TOML file. The forms'
  // section holds single-line basic strings only, whose escapes are JSON's.
  function tomlSection(text, name) {
    const out = {};
    let inside = false;
    for (const line of text.split("\n")) {
      const header = line.match(/^\s*\[([^\]]+)\]\s*$/);
      if (header) {
        inside = header[1].trim() === name;
        continue;
      }
      if (!inside) continue;
      const m = line.match(/^\s*([A-Za-z0-9_]+)\s*=\s*("(?:[^"\\]|\\.)*")\s*$/);
      if (m) {
        try {
          out[m[1]] = JSON.parse(m[2]);
        } catch {
          // a line it cannot read falls back to English
        }
      }
    }
    return out;
  }

  // The forms' strings — the `[web_account]` section of the application's
  // own locale files, English underneath the chosen language — and a `t`
  // that fills in `%{name}`. Fetched before the wasm, which is not loaded
  // until someone has signed in.
  async function loadStrings() {
    const locale = preferredLocale();
    const names = locale === "en" ? ["en"] : ["en", locale];
    const texts = await Promise.all(
      names.map(async (name) => {
        try {
          const res = await fetch(url(`locales/${name}.toml`));
          return res.ok ? await res.text() : "";
        } catch {
          return "";
        }
      }),
    );
    const strings = {};
    for (const text of texts) Object.assign(strings, tomlSection(text, "web_account"));
    document.documentElement.lang = locale;
    return (key, vars = {}) =>
      (strings[key] ?? key).replace(/%\{(\w+)\}/g, (_, name) => (vars[name] ?? "").toString());
  }
  const t = await loadStrings();
  for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll("[data-i18n-placeholder]")) {
    el.placeholder = t(el.dataset.i18nPlaceholder);
  }

  /** `api` with a JSON body. */
  const send = (method, path, body) =>
    api(path, {
      method,
      headers: { "content-type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body),
    });

  /** What the bridge said about a refused request: its message, else the status. */
  async function failure(res) {
    try {
      const body = await res.json();
      return body.message || body.error || `HTTP ${res.status}`;
    } catch {
      return `HTTP ${res.status}`;
    }
  }

  /** The string key of a role as the bridge spells it. */
  const roleKey = (role) => ({ admin: "role_admin", full: "role_full", read_only: "role_read_only" })[role] || role;

  // The account's page data, as the bridge answers it, or "" when it could
  // not: the module then keeps this page's changes to itself rather than
  // replace the account's with them. The preferences among it are put where
  // the application reads its settings — the account's, on any browser.
  async function pageDataOfAccount() {
    try {
      const res = await api("/v1/page-data");
      if (!res.ok) return "";
      const text = await res.text();
      const prefs = JSON.parse(text).rows?.find((row) => row.table === "preferences" && row.key === "zedis.toml");
      if (prefs) {
        try {
          localStorage.setItem("zedis:zedis.toml", prefs.value);
        } catch {
          // denied storage: the application starts on its defaults
        }
      }
      return text;
    } catch {
      return "";
    }
  }

  async function start() {
    // The whole application, as the desktop builds it, compiled to wasm.
    show("loading");
    try {
      // The UI font rides in with the call: the web text system has no
      // fonts of its own, and the first frame measures text. Locales are
      // the same kind of thing — `t!` is synchronous — so they land before
      // `run`, not on a later frame.
      // What this account keeps on the bridge (ADR 17) — asked first, because
      // its preferences decide the language the locales below are fetched in.
      const pageData = await pageDataOfAccount();
      const locale = preferredLocale();
      const localeNames = locale === "en" ? ["en"] : ["en", locale];
      const [mod, font, localeFiles] = await Promise.all([
        import(url("wasm/zedis_web.js")),
        fetch(url("fonts/IBMPlexSans.ttf")).then((r) => {
          if (!r.ok) throw new Error(`font: HTTP ${r.status}`);
          return r.arrayBuffer();
        }),
        Promise.all(localeNames.map(async (name) => {
          const r = await fetch(url(`locales/${name}.toml`));
          if (!r.ok) throw new Error(`locale ${name}: HTTP ${r.status}`);
          return [name, await r.text()];
        })),
      ]);
      // Pass the hashed wasm URL: wasm-bindgen's default `new URL(..., import.meta.url)`
      // would drop the JS file's query string and fetch an unversioned module.
      await mod.default(url("wasm/zedis_web_bg.wasm"));
      mod.set_asset_revs(JSON.stringify(ASSET_REV));
      for (const [name, text] of localeFiles) mod.install_locale(name, text);
      $("loading").hidden = true;
      // The third argument: whether shortcuts are drawn as ⌘K or Ctrl+K. The
      // module cannot know — it is the same bytes on every machine. Both
      // spellings are bound regardless, so a wrong guess only mislabels.
      // Case-insensitive on purpose: `userAgentData.platform` says "macOS",
      // `navigator.platform` says "MacIntel". And `||`, not `??`: a browser
      // that trims its client hints answers "" there, which is not nullish.
      const appleKeyboard = /mac|iphone|ipad/i.test(navigator.userAgentData?.platform || navigator.platform || "");
      // `root`, not the origin: the module builds `/v1/…` and the icon URLs
      // on it, so they follow the page under a base path.
      mod.run(root, new Uint8Array(font), appleKeyboard, pageData);
      // A page nobody is looking at polls the bridge far less often. Browsers
      // throttle a hidden tab's timers but never stop them, and a tab left
      // open for the weekend would otherwise keep its heartbeat going.
      const reportVisibility = () => mod.set_page_visible(!document.hidden);
      document.addEventListener("visibilitychange", reportVisibility);
      reportVisibility();
    } catch (e) {
      $("loading-msg").textContent = t("start_failed", { error: e });
      $("loading-msg").className = "msg bad";
    }
  }

  async function signedIn() {
    const res = await api("/v1/servers");
    return res.ok;
  }

  // The bridge signs people in by the name they registered (ADR 17); which
  // entries they then see depends on who they are.
  // Signed in once, a browser stays signed in: the bridge keeps the login on
  // disk, so neither a reload nor a restart of the bridge asks again, and this
  // form only comes back when /v1/servers answers 401 — the login lapsed, was
  // closed, or the account's password changed.
  const credentials = () => ({
    username: $("username").value.trim(),
    password: $("password").value,
    remember: $("remember").checked,
  });

  $("login-form").onsubmit = async (event) => {
    event.preventDefault();
    $("go").disabled = true;
    try {
      const res = await api("/v1/login", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(credentials()),
      });
      if (!res.ok) {
        $("login-msg").textContent = t(res.status === 429 ? "too_many_attempts" : "wrong_password");
        return;
      }
      $("password").value = "";
      if (!(await keptCookie("login-msg"))) return;
      await start();
    } catch (e) {
      $("login-msg").textContent = t("unreachable", { error: e });
    } finally {
      $("go").disabled = false;
    }
  };

  // A 200 only says the request was right. The login is the cookie, and a
  // browser silently drops a `Secure` cookie that arrives over plain http
  // from anything but localhost — the app would then start and meet a 401
  // on its first request with nothing to explain it. Ask once, the way the
  // app is about to, and say what happened instead.
  async function keptCookie(msg) {
    if (await signedIn()) return true;
    $(msg).textContent = t(window.location.protocol === "http:" ? "cookie_http" : "cookie_blocked");
    return false;
  }

  function show(id) {
    for (const main of ["login", "setup", "signup", "register", "loading"]) $(main).hidden = main !== id;
  }

  // What a new password has to be, said before the bridge says it.
  function passwordProblem(password, confirm) {
    if ([...password].length < 8) return t("password_short");
    if (password !== confirm) return t("passwords_differ");
    return null;
  }

  // What the page offers besides signing in: creating the administrator,
  // and asking for an account where the bridge takes requests.
  async function offers() {
    try {
      const res = await api("/v1/setup");
      if (!res.ok) return { open: false, signup: false };
      const body = await res.json();
      return { open: body.open === true, signup: body.signup === true };
    } catch {
      return { open: false, signup: false };
    }
  }

  async function showSignIn() {
    const { open, signup } = await offers();
    $("to-setup").hidden = !open;
    $("to-signup").hidden = !signup;
    if (open) {
      show("setup");
      $("setup-token").focus();
    } else {
      show("login");
      $("username").focus();
    }
  }
  $("to-setup").onclick = () => {
    show("setup");
    $("setup-token").focus();
  };
  $("to-login").onclick = () => {
    show("login");
    $("username").focus();
  };
  $("to-signup").onclick = () => {
    show("signup");
    $("signup-name").focus();
  };
  $("signup-to-login").onclick = () => {
    show("login");
    $("username").focus();
  };

  $("signup-form").onsubmit = async (event) => {
    event.preventDefault();
    const problem = passwordProblem($("signup-password").value, $("signup-confirm").value);
    if (problem) {
      $("signup-msg").className = "msg bad";
      $("signup-msg").textContent = problem;
      return;
    }
    $("signup-go").disabled = true;
    try {
      const res = await send("POST", "/v1/signup", {
        name: $("signup-name").value.trim(),
        password: $("signup-password").value,
        note: $("signup-note").value,
      });
      if (!res.ok) {
        const known = { 404: "signup_closed", 409: "signup_full", 429: "too_many_attempts" }[res.status];
        $("signup-msg").className = "msg bad";
        $("signup-msg").textContent = known ? t(known) : t("error_generic", { error: await failure(res) });
        return;
      }
      // Asked: nothing signs in until an administrator approves it, so the
      // form goes and says so; the password is not kept on the page.
      $("signup-password").value = "";
      $("signup-confirm").value = "";
      $("signup-form").hidden = true;
      $("signup-msg").className = "msg good";
      $("signup-msg").textContent = t("signup_sent");
    } catch (e) {
      $("signup-msg").className = "msg bad";
      $("signup-msg").textContent = t("unreachable", { error: e });
    } finally {
      $("signup-go").disabled = false;
    }
  };

  $("setup-form").onsubmit = async (event) => {
    event.preventDefault();
    const problem = passwordProblem($("setup-password").value, $("setup-confirm").value);
    if (problem) {
      $("setup-msg").textContent = problem;
      return;
    }
    $("setup-go").disabled = true;
    try {
      const res = await send("POST", "/v1/setup", {
        token: $("setup-token").value.trim(),
        name: $("setup-name").value.trim(),
        password: $("setup-password").value,
        remember: true,
      });
      if (!res.ok) {
        const known = { 403: "setup_refused", 404: "setup_closed", 429: "too_many_attempts" }[res.status];
        $("setup-msg").textContent = known ? t(known) : t("error_generic", { error: await failure(res) });
        return;
      }
      $("setup-password").value = "";
      $("setup-confirm").value = "";
      if (!(await keptCookie("setup-msg"))) return;
      await start();
    } catch (e) {
      $("setup-msg").textContent = t("unreachable", { error: e });
    } finally {
      $("setup-go").disabled = false;
    }
  };

  // `#invite=<code>`: the fragment is never sent to the bridge, so the code
  // stays out of every access log on the way; it goes in a request body.
  async function showInvitation(code) {
    show("register");
    const res = await send("POST", "/v1/invitation", { code });
    if (!res.ok) {
      $("register-title").textContent = t("invite_title");
      $("register-intro").textContent = t(res.status === 429 ? "too_many_attempts" : "invite_invalid");
      $("register-form").hidden = true;
      return;
    }
    const invite = await res.json();
    const role = t(roleKey(invite.role));
    let ask = { name: true, password: true };
    if (invite.kind === "reset") {
      $("register-title").textContent = t("reset_title");
      $("register-intro").textContent = t("reset_intro", { name: invite.account });
      $("register-go").textContent = t("reset_go");
      ask = { name: false, password: true };
    } else if (invite.proxy) {
      $("register-title").textContent = t("register_title");
      $("register-go").textContent = t("register_go");
      ask = { name: false, password: false };
      if (invite.proxy_name) {
        $("register-intro").textContent = t("register_proxy_intro", { role, name: invite.proxy_name });
      } else {
        $("register-intro").textContent = t("register_proxy_missing");
        $("register-form").hidden = true;
      }
    } else {
      $("register-title").textContent = t("register_title");
      $("register-intro").textContent = t("register_intro", { role });
      $("register-go").textContent = t("register_go");
    }
    $("register-name-row").hidden = !ask.name;
    $("register-password-row").hidden = !ask.password;
    $("register-confirm-row").hidden = !ask.password;
    $("register-form").onsubmit = async (event) => {
      event.preventDefault();
      if (ask.password) {
        const problem = passwordProblem($("register-password").value, $("register-confirm").value);
        if (problem) {
          $("register-msg").textContent = problem;
          return;
        }
      }
      $("register-go").disabled = true;
      try {
        const res = await send("POST", "/v1/register", {
          code,
          name: $("register-name").value.trim(),
          password: $("register-password").value,
          remember: $("register-remember").checked,
        });
        if (!res.ok) {
          const known = { 409: "name_taken", 429: "too_many_attempts" }[res.status];
          $("register-msg").textContent = known ? t(known) : t("error_generic", { error: await failure(res) });
          return;
        }
        // Used up: a reload must not offer it again.
        history.replaceState(null, "", window.location.pathname + window.location.search);
        if (!(await keptCookie("register-msg"))) return;
        await start();
      } catch (e) {
        $("register-msg").textContent = t("unreachable", { error: e });
      } finally {
        $("register-go").disabled = false;
      }
    };
    (ask.name ? $("register-name") : $("register-password")).focus();
  }

  // An invitation link pasted into a tab already on this page — the
  // sign-in form, or the application itself — changes only the fragment,
  // which reloads nothing: start over so it is read.
  window.addEventListener("hashchange", () => {
    if (new URLSearchParams(window.location.hash.slice(1)).has("invite")) window.location.reload();
  });

  const invite = new URLSearchParams(window.location.hash.slice(1)).get("invite");
  if (invite) {
    await showInvitation(invite);
  } else if (await signedIn()) {
    await start();
  } else {
    await showSignIn();
  }
</script>
</body>
</html>
